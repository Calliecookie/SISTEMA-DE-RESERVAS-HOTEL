limit_req_zone $binary_remote_addr zone=hotel_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=hotel_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=hotel_acceso:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=hotel_conexiones:10m;

upstream hotel_aplicacion {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tu-dominio.pe;

    ssl_certificate /etc/letsencrypt/live/tu-dominio.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.pe/privkey.pem;

    client_max_body_size 3m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    limit_conn hotel_conexiones 30;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location = /ingresar {
        limit_req zone=hotel_acceso burst=5 nodelay;
        proxy_pass http://hotel_aplicacion;
    }

    location /api/ {
        limit_req zone=hotel_api burst=20 nodelay;
        proxy_pass http://hotel_aplicacion;
    }

    location /recursos/ {
        expires 7d;
        proxy_pass http://hotel_aplicacion;
    }

    location / {
        limit_req zone=hotel_general burst=30 nodelay;
        proxy_pass http://hotel_aplicacion;
    }
}

server {
    listen 80;
    server_name tu-dominio.pe;
    return 301 https://$host$request_uri;
}
