<!DOCTYPE html>
<html lang="es-PE" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{componentes/cabeza :: cabeza(${titulo}, 'panel')}"></head>
<body class="panel">
<aside th:replace="~{componentes/lateral :: lateral(${seccion})}"></aside>
<main class="panel__principal">
  <header th:replace="~{componentes/lateral :: cabecera(${titulo})}"></header>
  <div class="panel__seccion">
    <section class="superficie">
      <div class="bloque__cabecera">
        <h2 class="bloque__titulo">Estado en vivo</h2>
        <span class="en-vivo" data-actualizado aria-live="polite">Conectando</span>
      </div>
      <div class="bloque__cuerpo"><div class="leyenda" data-leyenda role="group" aria-label="Filtrar por situación"></div></div>
      <div data-mapa aria-live="polite"></div>
    </section>
    <section class="superficie">
      <div class="bloque__cabecera">
        <h2 class="bloque__titulo">Planificador de ocupación</h2>
        <div class="panel__acciones">
          <button class="boton boton--secundario boton--icono" type="button" data-plan-mover="-7" aria-label="Semana anterior"><svg th:replace="~{componentes/icono :: icono('flecha-izq')}"></svg></button>
          <button class="boton boton--secundario boton--compacto" type="button" data-plan-hoy>Hoy</button>
          <button class="boton boton--secundario boton--icono" type="button" data-plan-mover="7" aria-label="Semana siguiente"><svg th:replace="~{componentes/icono :: icono('flecha-der')}"></svg></button>
          <label class="oculto-visual" for="plan-dias">Días visibles</label>
          <select class="entrada entrada--compacta" id="plan-dias" data-plan-dias><option value="14">14 días</option><option value="21">21 días</option><option value="31">31 días</option></select>
        </div>
      </div>
      <div class="plan" data-plan aria-live="polite"></div>
    </section>
  </div>
</main>
<script type="module" th:src="@{/recursos/js/monitor.js}"></script>
</body>
</html>
