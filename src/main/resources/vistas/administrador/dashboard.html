<!DOCTYPE html>
<html lang="es-PE" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{componentes/cabeza :: cabeza(${titulo}, 'panel')}"></head>
<body class="panel">
<aside th:replace="~{componentes/lateral :: lateral(${seccion})}"></aside>
<main class="panel__principal">
  <header th:replace="~{componentes/lateral :: cabecera(${titulo})}"></header>
  <div class="panel__seccion">
    <div class="bento" data-bento aria-live="polite"></div>
    <div class="indicadores" data-indicadores aria-live="polite"></div>
    <div class="bloques bloques--2">
      <section class="superficie"><div class="bloque__cabecera"><h2 class="bloque__titulo">Ingresos por mes</h2></div><div class="bloque__cuerpo" data-grafico></div></section>
      <section class="superficie"><div class="bloque__cabecera"><h2 class="bloque__titulo">Actividad reciente</h2></div><ul class="actividad" data-actividad></ul></section>
    </div>
    <section class="superficie"><div class="bloque__cabecera"><h2 class="bloque__titulo">Reservas recientes</h2><a class="enlace texto-sm" th:href="@{/administracion/reservas}">Ver todas</a></div><div data-recientes></div></section>
  </div>
</main>
<script type="module" th:src="@{/recursos/js/dashboard.js}"></script>
</body>
</html>
