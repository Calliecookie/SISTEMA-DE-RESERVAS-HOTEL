<!DOCTYPE html>
<html lang="es-PE" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{componentes/cabeza :: cabeza(${titulo}, 'panel')}"></head>
<body class="panel">
<aside th:replace="~{componentes/lateral :: lateral(${seccion})}"></aside>
<main class="panel__principal">
  <header th:replace="~{componentes/lateral :: cabecera(${titulo})}"></header>
  <div class="panel__seccion">
    <section class="superficie">
      <form class="barra-filtros" data-filtros>
        <label class="campo"><span class="campo__etiqueta">Buscar</span><input class="entrada" type="search" name="busqueda" placeholder="Número, nombre o categoría" maxlength="60" autocomplete="off"></label>
        <label class="campo"><span class="campo__etiqueta">Estado</span><select class="entrada" name="estado"><option value="">Todos</option><option value="DISPONIBLE">Disponible</option><option value="RESERVADA">Reservada</option><option value="OCUPADA">Ocupada</option><option value="MANTENIMIENTO">En mantenimiento</option><option value="FUERA_DE_SERVICIO">Fuera de servicio</option></select></label>
      </form>
      <p class="superficie__nota texto-sm texto-suave" data-resumen-estados aria-live="polite"></p>
      <div class="tabla-envoltura" data-tabla aria-live="polite"></div>
      <div data-paginacion></div>
    </section>
  </div>
</main>
<script type="module" th:src="@{/recursos/js/habitaciones-admin.js}"></script>
</body>
</html>
