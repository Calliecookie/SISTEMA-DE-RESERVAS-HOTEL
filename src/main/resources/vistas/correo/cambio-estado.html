<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es-PE">
<body style="margin:0;padding:24px 12px;background:#F2EFE8;font-family:Arial,Helvetica,sans-serif;color:#1A2024;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:540px;margin:0 auto;background:#FFFFFF;border:1px solid #E3DED2;border-radius:14px;overflow:hidden;">
    <tr><td style="padding:22px 28px;background:#1B2A4E;border-bottom:4px solid #D9A21B;">
      <p style="margin:0;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#D9A21B;">Casa del sol</p>
      <h1 style="margin:4px 0 0;font-size:22px;font-family:Georgia,'Times New Roman',serif;font-weight:normal;color:#FFFFFF;" th:text="${hotel}">Hotel</h1>
    </td></tr>
    <tr><td style="padding:26px 28px 8px;font-size:15px;line-height:1.55;">
      <p style="margin:0 0 12px;">Hola, <span th:text="${nombre}">cliente</span>:</p>
      <p style="margin:0 0 12px;">El estado de tu reserva <strong th:text="${codigo}">código</strong> cambió a:</p>
      <p style="margin:0 0 14px;padding:12px;text-align:center;background:#EEF2FA;border-radius:10px;font-size:20px;font-weight:bold;color:#1B2A4E;" th:text="${estado}">estado</p>
      <p style="margin:0 0 12px;" th:if="${motivo}">Detalle: <span th:text="${motivo}">motivo</span></p>
      <p style="margin:0 0 12px;">Puedes ver el avance de tu reserva en cualquier momento desde tu cuenta.</p>
    </td></tr>
    <tr><td style="padding:14px 28px 22px;font-size:12px;color:#6B7378;border-top:1px solid #EFEBE2;">
      Este mensaje se envió automáticamente. Si no reconoces esta operación, comunícate con la recepción del hotel.
    </td></tr>
  </table>
</body>
</html>
